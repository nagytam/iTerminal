name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false

jobs:
  linux:
    name: Build and unit tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore iTerminal.slnx

      - name: Build
        run: dotnet build iTerminal.slnx -c Release --no-restore

      - name: Unit tests
        run: >-
          dotnet test iConsole.Test/iConsole.Test.csproj
          -c Release --no-build
          --logger "trx;LogFileName=iconsole.trx"
          --results-directory TestResults
          && dotnet test iTerminal.Core.Test/iTerminal.Core.Test.csproj
          -c Release --no-build
          --logger "trx;LogFileName=iterminal-core.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  windows:
    name: Build and full suite (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore iTerminal.slnx

      - name: Build
        run: dotnet build iTerminal.slnx -c Release --no-restore

      - name: Test (including end-to-end suite)
        run: >-
          dotnet test iTerminal.slnx -c Release --no-build
          --logger "trx;LogFileName=all.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults/**/*.trx
          if-no-files-found: ignore
