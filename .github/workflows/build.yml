name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false

jobs:
  linux:
    name: Build and unit tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore iTerminal.slnx

      # The WiX installer project only builds on Windows.
      - name: Build
        run: >-
          dotnet build iConsole.Test/iConsole.Test.csproj -c Release --no-restore
          && dotnet build iTerminal.Core.Test/iTerminal.Core.Test.csproj -c Release --no-restore
          && dotnet build iTerminal/iTerminal.csproj -c Release --no-restore

      - name: Unit tests
        run: >-
          dotnet test iConsole.Test/iConsole.Test.csproj
          -c Release --no-build
          --logger "trx;LogFileName=iconsole.trx"
          --settings coverage.runsettings --collect:"XPlat Code Coverage"
          --results-directory TestResults
          && dotnet test iTerminal.Core.Test/iTerminal.Core.Test.csproj
          -c Release --no-build
          --logger "trx;LogFileName=iterminal-core.trx"
          --settings coverage.runsettings --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Code coverage report
        if: always()
        run: >-
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.1
          && reportgenerator
          "-reports:TestResults/**/coverage.cobertura.xml"
          "-targetdir:CoverageReport"
          "-reporttypes:Html;MarkdownSummaryGithub;Cobertura"
          && cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: CoverageReport
          if-no-files-found: ignore

  windows:
    name: Build and full suite (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore iTerminal.slnx

      # One project at a time: the installer project publishes the app with a nested dotnet
      # publish, which compiles iConsole into the same obj folder as the build around it.
      - name: Build
        run: dotnet build iTerminal.slnx -c Release --no-restore -m:1

      - name: Test (including end-to-end suite)
        run: >-
          dotnet test iTerminal.slnx -c Release --no-build
          --logger "trx;LogFileName=all.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults/**/*.trx
          if-no-files-found: ignore
