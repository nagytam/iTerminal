name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false

jobs:
  linux:
    name: Build and full suite (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      # The solution marks the Posix test project as non-building (it only compiles on Linux),
      # so restoring the solution skips it: restore it by name.
      - name: Restore
        run: >-
          dotnet restore iTerminal.slnx
          && dotnet restore iConsole.Inputs.Posix.Test/iConsole.Inputs.Posix.Test.csproj

      # The WiX installer project only builds on Windows.
      - name: Build
        run: >-
          dotnet build iConsole.Formats.Test/iConsole.Formats.Test.csproj -c Release --no-restore
          && dotnet build iConsole.Test/iConsole.Test.csproj -c Release --no-restore
          && dotnet build iConsole.Inputs.Posix.Test/iConsole.Inputs.Posix.Test.csproj -c Release --no-restore
          && dotnet build iTerminal.Core.Games.Test/iTerminal.Core.Games.Test.csproj -c Release --no-restore
          && dotnet build iTerminal.Core.Test/iTerminal.Core.Test.csproj -c Release --no-restore
          && dotnet build iTerminal/iTerminal.csproj -c Release --no-restore
          && dotnet build iTerminal.Test/iTerminal.Test.csproj -c Release --no-restore

      # Every test has a 120 s [Timeout]; the blame timeout kills the test host when one stops answering altogether
      # (and names it), and the step limit is the backstop, so a run can never hang for the rest of the job.
      - name: Tests (including end-to-end suite)
        timeout-minutes: 20
        run: >-
          dotnet test iConsole.Formats.Test/iConsole.Formats.Test.csproj
          -c Release --no-build
          --logger "trx;LogFileName=iconsole-formats.trx"
          --settings coverage.runsettings --collect:"XPlat Code Coverage"
          --results-directory TestResults
          && dotnet test iConsole.Test/iConsole.Test.csproj
          -c Release --no-build
          --logger "trx;LogFileName=iconsole.trx"
          --settings coverage.runsettings --collect:"XPlat Code Coverage"
          --results-directory TestResults
          && dotnet test iConsole.Inputs.Posix.Test/iConsole.Inputs.Posix.Test.csproj
          -c Release --no-build
          --logger "trx;LogFileName=iconsole-posix.trx"
          --results-directory TestResults
          && dotnet test iTerminal.Core.Games.Test/iTerminal.Core.Games.Test.csproj
          -c Release --no-build
          --logger "trx;LogFileName=iterminal-games.trx"
          --settings coverage.runsettings --collect:"XPlat Code Coverage"
          --results-directory TestResults
          && dotnet test iTerminal.Core.Test/iTerminal.Core.Test.csproj
          -c Release --no-build
          --logger "trx;LogFileName=iterminal-core.trx"
          --settings coverage.runsettings --collect:"XPlat Code Coverage"
          --results-directory TestResults
          && dotnet test iTerminal.Test/iTerminal.Test.csproj
          -c Release --no-build
          --logger "trx;LogFileName=iterminal-e2e.trx"
          --settings ci.runsettings --blame-hang-timeout 5m --blame-hang-dump-type none
          --results-directory TestResults

      - name: Code coverage report
        if: always()
        run: >-
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.1
          && reportgenerator
          "-reports:TestResults/**/coverage.cobertura.xml"
          "-targetdir:CoverageReport"
          "-reporttypes:Html;MarkdownSummaryGithub;Cobertura"
          && cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux
          path: TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: CoverageReport
          if-no-files-found: ignore

  windows:
    name: Build and full suite (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Restore
        run: dotnet restore iTerminal.slnx

      # One project at a time: the installer project publishes the app with a nested dotnet
      # publish, which compiles iConsole into the same obj folder as the build around it.
      - name: Build
        run: dotnet build iTerminal.slnx -c Release --no-restore -m:1

      # The suite takes about 25 minutes here; see the Linux job for what the limits are for.
      - name: Test (including end-to-end suite)
        timeout-minutes: 38
        run: >-
          dotnet test iTerminal.slnx -c Release --no-build
          --settings ci.runsettings --blame-hang-timeout 5m --blame-hang-dump-type none
          --logger "trx;LogFileName=all.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: TestResults/**/*.trx
          if-no-files-found: ignore
