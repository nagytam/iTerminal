name: Release builds

# Builds the Windows installer, the Windows portable archive, the Linux packages and the macOS portable archives. Merging a
# pull request into main runs it and publishes the packages as a GitHub Release tagged v<version>; a manual run only attaches
# them to the run as artifacts.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  # The build number of this run; the same version goes into every package it produces.
  VERSION: 0.0.0.${{ github.run_number }}

jobs:
  windows:
    name: Windows installer (MSI) and portable archive
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build the MSI
        run: dotnet build iTerminal.Installer/iTerminal.Installer.wixproj -c Release -p:Version=$env:VERSION

      - name: Build the portable archive
        shell: pwsh
        run: |
          # The same self-contained build as the MSI, zipped with the marker file that tells the app it is a portable copy.
          dotnet publish iTerminal/iTerminal.csproj -c Release -r win-x64 --self-contained -p:Version=$env:VERSION -o portable
          New-Item -ItemType File -Path portable/iTerminal.portable | Out-Null
          New-Item -ItemType Directory -Force iTerminal.Installer/bin/Release | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path portable).Path, (Join-Path (Get-Location) "iTerminal.Installer/bin/Release/iTerminal-$env:VERSION-x64-portable.zip"))

      - name: Upload the MSI and the portable archive
        uses: actions/upload-artifact@v7
        with:
          name: iTerminal-${{ env.VERSION }}-windows-x64
          path: |
            iTerminal.Installer/bin/Release/*.msi
            iTerminal.Installer/bin/Release/*-portable.zip
          if-no-files-found: error

  linux:
    name: Linux packages (tar.gz, deb, rpm) and portable archives
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build the packages
        run: >-
          dotnet build iTerminal.Packaging.Linux/iTerminal.Packaging.Linux.proj
          -p:Version=$VERSION -p:Runtimes="linux-x64+linux-arm64"

      - name: Build the portable archives
        run: |
          # The same self-contained build as the packages, unpacked into a folder with the marker file that tells the app
          # it is a portable copy. One archive per runtime, as the packages have.
          for rid in linux-x64 linux-arm64; do
            folder="iTerminal-$VERSION-$rid-portable"
            dotnet publish iTerminal/iTerminal.csproj -c Release -r "$rid" --self-contained -p:Version=$VERSION -o "$folder"
            touch "$folder/iTerminal.portable"
            tar -czf "$folder.tar.gz" "$folder"
          done

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: iTerminal-${{ env.VERSION }}-linux
          path: |
            iTerminal.Packaging.Linux/bin/Release/*.tar.gz
            iTerminal.Packaging.Linux/bin/Release/*.deb
            iTerminal.Packaging.Linux/bin/Release/*.rpm
            iTerminal-*-portable.tar.gz
          if-no-files-found: error

  macos:
    name: macOS portable archives (arm64, x64)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build the portable archives
        run: |
          # The same self-contained build as the Linux archives, one per architecture, with the marker file that tells the
          # app it is a portable copy. tar is told not to store the macOS extended attributes, which would show up as
          # stray "._" files wherever the archive is unpacked on another system.
          for rid in osx-arm64 osx-x64; do
            folder="iTerminal-$VERSION-$rid-portable"
            dotnet publish iTerminal/iTerminal.csproj -c Release -r "$rid" --self-contained -p:Version=$VERSION -o "$folder"
            touch "$folder/iTerminal.portable"
            COPYFILE_DISABLE=1 tar -czf "$folder.tar.gz" "$folder"
          done

      - name: Check that the app starts
        run: |
          # The app has no --version switch, so it is started without a terminal. macOS has no timeout command, so it runs in
          # the background for ten seconds: still running then is the expected state. Exiting at once is fine too, unless the
          # code says the file cannot run (126, 127) or the system killed it, as it does an unsigned or damaged binary (137).
          for rid in osx-arm64 osx-x64; do
            "iTerminal-$VERSION-$rid-portable/iTerminal" < /dev/null > /dev/null 2>&1 &
            pid=$!
            sleep 10
            if kill -0 "$pid" 2>/dev/null; then
              echo "$rid: running after 10 seconds"
              kill "$pid"
              wait "$pid" 2>/dev/null || true
              continue
            fi
            set +e
            wait "$pid"
            code=$?
            set -e
            echo "$rid: exited with code $code"
            if [ "$code" -eq 126 ] || [ "$code" -eq 127 ] || [ "$code" -eq 137 ]; then
              echo "$rid does not start"
              exit 1
            fi
          done

      - name: Upload the portable archives
        uses: actions/upload-artifact@v7
        with:
          name: iTerminal-${{ env.VERSION }}-macos
          path: iTerminal-*-portable.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          path: packages
          pattern: iTerminal-${{ env.VERSION }}-*
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The Linux artifact keeps the folders the packages were built in, so the download nests them. Attach the files only:
          # a folder in the list makes gh fail after the release is created.
          mapfile -t assets < <(find packages -type f)
          [ "${#assets[@]}" -gt 0 ] || { echo "No packages were downloaded"; exit 1; }
          gh release create "v$VERSION" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "iTerminal $VERSION" \
            --notes "Built from #$PR_NUMBER: $PR_TITLE" \
            --generate-notes
