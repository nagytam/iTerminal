name: Release builds

# Builds the Windows installer and the Linux packages. Merging a pull request into main runs it
# and publishes the packages as a GitHub Release tagged v<version>; a manual run only attaches
# them to the run as artifacts.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  # The build number of this run; the same version goes into every package it produces.
  VERSION: 0.0.0.${{ github.run_number }}

jobs:
  windows:
    name: Windows installer (MSI)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the MSI
        run: dotnet build iTerminal.Installer/iTerminal.Installer.wixproj -c Release -p:Version=$env:VERSION

      - name: Upload the MSI
        uses: actions/upload-artifact@v7
        with:
          name: iTerminal-${{ env.VERSION }}-windows-x64
          path: iTerminal.Installer/bin/**/Release/*.msi
          if-no-files-found: error

  linux:
    name: Linux packages (tar.gz, deb, rpm)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the packages
        run: >-
          dotnet build iTerminal.Packaging.Linux/iTerminal.Packaging.Linux.proj
          -p:Version=$VERSION -p:Runtimes="linux-x64+linux-arm64"

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: iTerminal-${{ env.VERSION }}-linux
          path: |
            iTerminal.Packaging.Linux/bin/Release/*.tar.gz
            iTerminal.Packaging.Linux/bin/Release/*.deb
            iTerminal.Packaging.Linux/bin/Release/*.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    needs: [windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          path: packages
          pattern: iTerminal-${{ env.VERSION }}-*
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: >-
          gh release create "v$VERSION" packages/*
          --repo "$GITHUB_REPOSITORY"
          --target "${{ github.event.pull_request.merge_commit_sha }}"
          --title "iTerminal $VERSION"
          --notes "Built from #$PR_NUMBER: $PR_TITLE"
          --generate-notes
