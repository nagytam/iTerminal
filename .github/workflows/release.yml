name: Release builds

# Builds the Windows installer and the Linux packages. Nothing is published as a GitHub Release:
# the packages are attached to the run as artifacts, to be downloaded and checked before anyone
# hands them out.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  # The build number of this run; the same version goes into every package it produces.
  VERSION: 0.0.0.${{ github.run_number }}

jobs:
  windows:
    name: Windows installer (MSI)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the MSI
        run: dotnet build iTerminal.Installer/iTerminal.Installer.wixproj -c Release -p:Version=$env:VERSION

      - name: Upload the MSI
        uses: actions/upload-artifact@v4
        with:
          name: iTerminal-${{ env.VERSION }}-windows-x64
          path: iTerminal.Installer/bin/Release/*.msi
          if-no-files-found: error

  linux:
    name: Linux packages (tar.gz, deb, rpm)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the packages
        run: >-
          dotnet build iTerminal.Packaging.Linux/iTerminal.Packaging.Linux.proj
          -p:Version=$VERSION -p:Runtimes="linux-x64%3Blinux-arm64"

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: iTerminal-${{ env.VERSION }}-linux
          path: |
            iTerminal.Packaging.Linux/bin/Release/*.tar.gz
            iTerminal.Packaging.Linux/bin/Release/*.deb
            iTerminal.Packaging.Linux/bin/Release/*.rpm
          if-no-files-found: error
